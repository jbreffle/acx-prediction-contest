name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint_and_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v4
      - name: Sync dependencies
        run: uv sync --frozen --group dev --group notebooks
      - name: Lint with flake8
        run: |
          uv run flake8 src streamlit scripts --jobs=1 --count --select=E9,F63,F7,F82 --show-source --statistics
          uv run flake8 src streamlit scripts --jobs=1 --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Test with pytest
        run: uv run pytest -vv
      - name: Smoke test notebooks
        run: uv run pytest -vv scripts/notebook_smoke.py
